<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Viral Fiverr Intro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:black;
}

/* ===== PARTICLES BACKGROUND ===== */
#particles{
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle, #111, black);
overflow:hidden;
}

.p{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:0.5;
animation:float 10s linear infinite;
}

@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

/* ===== SCENES ===== */
.scene{
position:absolute;
width:100%;
height:100vh;
opacity:0;
transition:1.2s ease;
display:flex;
align-items:center;
justify-content:center;
}

.active{opacity:1;}

/* ===== BACKGROUND IMAGE ===== */
.bg{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(35%) contrast(120%);
transform:scale(1.2);
animation:zoom 6s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1.2);}
to{transform:scale(1.35);}
}

/* ===== GLITCH EFFECT ===== */
.glitch{
position:relative;
font-size:55px;
color:white;
text-shadow:0 0 20px cyan;
animation:glitch 1.5s infinite;
}

@keyframes glitch{
0%{transform:translate(0);}
20%{transform:translate(-2px,2px);}
40%{transform:translate(2px,-2px);}
60%{transform:translate(-1px,1px);}
80%{transform:translate(1px,-1px);}
100%{transform:translate(0);}
}

/* ===== CONTENT ===== */
.content{
position:relative;
text-align:center;
color:white;
z-index:2;
animation:fadeUp 1.2s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(50px);}
to{opacity:1; transform:translateY(0);}
}

/* ===== PROFILE ===== */
.profile{
width:170px;
height:170px;
border-radius:50%;
border:4px solid cyan;
box-shadow:0 0 30px cyan;
margin-bottom:20px;
}

/* ===== TYPEWRITER ===== */
.type{
font-size:20px;
margin-top:10px;
color:#ccc;
border-right:2px solid cyan;
white-space:nowrap;
overflow:hidden;
width:0;
animation:type 4s steps(40,end) forwards;
}

@keyframes type{
from{width:0;}
to{width:100%;}
}

/* ===== BUTTON ===== */
.btn{
margin-top:20px;
padding:12px 28px;
background:cyan;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px cyan;
}

/* ===== OVERLAY ===== */
.overlay{
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle, transparent, black 80%);
z-index:1;
}
</style>
</head>

<body>

<div id="particles"></div>

<!-- SCENE 1 -->
<div class="scene active">
<img class="bg" src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d">
<div class="overlay"></div>

<div class="content">
<img class="profile" src="YOUR_IMAGE_HERE.jpg">
<div class="glitch">SHEHZADI HOORAIN</div>
<div class="type">Graphic Designer • Web Developer • Creator</div>
</div>
</div>

<!-- SCENE 2 -->
<div class="scene">
<img class="bg" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
<div class="overlay"></div>

<div class="content">
<h1 class="glitch">I Build Digital Experiences</h1>
<p>Modern websites with cinematic UI</p>
</div>
</div>

<!-- SCENE 3 -->
<div class="scene">
<img class="bg" src="https://images.unsplash.com/photo-1555066931-4365d14bab8c">
<div class="overlay"></div>

<div class="content">
<h1 class="glitch">Website Transformation</h1>
<p>Boring Design → Viral Animated UI</p>
</div>
</div>

<!-- SCENE 4 -->
<div class="scene">
<img class="bg" src="https://images.unsplash.com/photo-1522542550221-31fd19575a2d">
<div class="overlay"></div>

<div class="content">
<h1 class="glitch">Code + Creativity</h1>
<p>HTML • CSS • JavaScript • Animation Magic</p>
</div>
</div>

<!-- SCENE 5 -->
<div class="scene">
<img class="bg" src="https://images.unsplash.com/photo-1551650975-87deedd944c3">
<div class="overlay"></div>

<div class="content">
<h1 class="glitch">Available on Fiverr</h1>
<p>Let’s build your dream website</p>
<button class="btn">Order Now</button>
</div>
</div>

<script>

/* ===== SCENE SWITCH ===== */
let scenes = document.querySelectorAll(".scene");
let i = 0;

function next(){
scenes.forEach(s => s.classList.remove("active"));
scenes[i].classList.add("active");

i++;
if(i < scenes.length){
setTimeout(next, 5000);
}
}

setTimeout(next, 1500);

/* ===== PARTICLES ===== */
const pContainer = document.getElementById("particles");

for(let i=0;i<60;i++){
let dot = document.createElement("div");
dot.classList.add("p");
dot.style.left = Math.random()*100 + "vw";
dot.style.animationDuration = (5+Math.random()*5)+"s";
pContainer.appendChild(dot);
}

</script>

</body>
</html>
